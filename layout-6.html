<!DOCTYPE html>
<html>
<head>
<title>Wireframe Layout</title>
<style>
body{
background-color: beige;
font-family: Arial, sans-serif;
}
.main{
width: 650px;
margin: auto;
border-collapse: collapse;
background-color: beige;
}
.main td{
border: 20px solid white;
padding: 5px;
}
.header{
width: 100%;
}
.header td{
border: none;
background-color: beige;
}
.grid{
width: 100%;
border-spacing: 20px; 
background-color: white;
}
.grid td{
border: 10px solid white;
height: 50px;
background-color: beige;
}
.boxes{
width: 100%;
border-spacing: 20px; 
background-color: white;
}
.boxes td{
border: 20px solid white;
height: 70px;
text-align: center;
vertical-align: middle;
background-color: beige;
}

.footer{
text-align: center;
background-color: beige;
}
</style>
</head>
<body>
<table class="main">
<tr>
<td>
<table class="header">
<tr>
<td width="20%">Logo</td>
<td width="30%">Navigation</td>
</tr>
</table>
</td>
</tr>
<tr>
<td>
<table class="grid">
 <tr>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
 </tr>
<tr>
<td></td>
<td></td>
<td></td>
<td></td>
</tr>
<tr>
<td></td>
<td></td>
<td></td>
<td></td>
</tr>
<tr>
<td></td>
<td></td>
<td></td>
<td></td>
</tr>
</table>
</td>
</tr>
<tr>
<td>
<table class="boxes">
<tr>
<td>Box 1</td>
<td>Box 2</td>
<td>Box 3</td>
</tr>
</table>
</td>
</tr>
<tr>
<td class="footer">Footer</td>
</tr>
</table>
</body>
</html>
