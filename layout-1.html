<!DOCTYPE html>
<html>
<head>
<title>Zerone Consulting</title>
<style>
* {
box-sizing: border-box;
}
body {
margin: 0;
font-family: Arial, sans-serif;
}
table {
width: 100%;
border-collapse: collapse;
}

td {
border: 2px solid #000;
vertical-align: top;
}

.logo {
width: 160px;
height: 80px;
text-align: center;
font-weight: bold;
vertical-align: middle;
}

.header {
height: 80px;
padding: 5px;
}
.menu {
height: 35px;
border-bottom: 2px solid #000;
font-weight: bold;
}
.search-row {
display: flex;
gap: 5px;
padding-top: 5px;
}
.search-box {
flex: 1;
height: 28px;
}
.search-btn {
width: 100px;
font-weight: bold;
}
.user {
width: 170px;
padding: 5px;
}
.user-box {
display: flex;
align-items: flex-start;
justify-content: space-between;
}
.profile {
width: 70px;
height: 60px;
 border: 2px solid #000;
}
.icons {
display: flex;
gap: 8px;
margin-top: 8px;
}
.icon {
width: 28px;
height: 24px;
border: 2px solid #000;
}
.sidebar {
width: 200px;
height: 360px;
}
.content {
height: 360px;
}
.footer {
height: 35px;
padding: 5px 12px;
font-weight: bold;
}
.footer-content {
display: flex;
justify-content: space-between;
}
.footer a {
color: #000;
margin-left: 20px;
}
</style>
</head>
<body>
<table>
<tr>
<td class="logo"> &lt;Logo&gt;</td>
<td class="header">
<div class="menu">&lt;Menu&gt;</div>
<div class="search-row">
<input type="text" class="search-box">
<button class="search-btn">Search</button>
</div>
</td>
<td class="user">
<div class="user-box">
<div class="profile"></div>
<div>
<strong>Welcome<br>Mr. Carlson</strong>
<div class="icons">
<div class="icon"></div>
 <div class="icon"></div>
 </div>
 </div>
</div>
</td>
</tr>
<tr>
<td class="sidebar"></td>
<td colspan="2" class="content"></td>
</tr>
<tr>
<td colspan="3" class="footer">
<div class="footer-content">
<span>@Zerone Consulting 2022</span>
<span>
<a href="#">Terms &amp; Conditions</a>
<a href="#">Privacy Policy</a>
</span>
</div>
</td>
</tr>
</table>
</body>
</html>
