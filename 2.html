<!DOCTYPE html>
<html>
<head>
    <title>Layout</title>
    <style>
        body{
            margin:0;
            
        }

        table{
            width:100%;
            height:700px;
            border-collapse:separate;
            border-spacing:10px;
            background:white;
        }

        td{
            background:yellowgreen;
            padding:12px;
            vertical-align:top;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <td colspan="2" height="50">Header</td>
        <td width="15%">Ads</td>
    </tr>

    <tr>
        <td rowspan="2" width="20%">Nav</td>
        <td colspan="2" height="450">Article</td>
    </tr>

    <tr>
        <td colspan="2" height="50">Footer</td>
    </tr>
</table>

</body>
</html>
